<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10111a">
  <title>GG AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #10111a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #191b29;
      border-bottom: 1px solid #292c3d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, #795cff, #19b8d8);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: bold;
    }

    header h1 {
      font-size: 21px;
      margin: 0;
    }

    header p {
      color: #9296aa;
      font-size: 12px;
      margin: 4px 0 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 13px 15px;
      border-radius: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .bot {
      align-self: flex-start;
      background: #202334;
      border: 1px solid #30344a;
      border-bottom-left-radius: 5px;
    }

    .user {
      align-self: flex-end;
      background: #6551df;
      border-bottom-right-radius: 5px;
    }

    .input-area {
      padding: 13px;
      background: #191b29;
      border-top: 1px solid #292c3d;
      display: flex;
      gap: 9px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid #34374b;
      background: #25283a;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 50px;
      border: none;
      border-radius: 13px;
      background: #7059f5;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    button:active {
      background: #5140c7;
    }

    footer {
      text-align: center;
      color: #777b91;
      font-size: 11px;
      padding: 7px;
      background: #191b29;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GG</div>
    <div>
      <h1>GG AI</h1>
      <p>by 777GDONLINE · Версия 2.0</p>
    </div>
  </header>

  <main id="chat">
    <div class="message bot">
      Привет! Я GG AI. Добро пожаловать!
      <br><br>
      Моя нейросеть скоро появится здесь.
    </div>
  </main>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Напиши сообщение..."
      autocomplete="off"
    >
    <button onclick="sendMessage()">➤</button>
  </div>

  <footer>
    GG AI · Создано 777GDONLINE
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      addMessage(
        "Интерфейс GG AI работает. Подключение нейросети Qwen 0.5B будет следующим этапом.",
        "bot"
      );
    }

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
